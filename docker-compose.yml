version: "3.8"

services:
  n8n:
    image: n8nio/n8n:2.5.0
    container_name: n8n-2.5.0
    restart: unless-stopped
    ports:
      - "7890:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - GENERIC_TIMEZONE=Asia/Shanghai
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-me-to-a-random-string}
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./n8n-files:/files
    networks:
      - n8n-network

networks:
  n8n-network:
    driver: bridge
