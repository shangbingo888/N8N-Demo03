services:
  n8n:
    image: n8n-demo03:local
    container_name: n8n-demo03
    restart: unless-stopped
    ports:
      - "7890:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - GENERIC_TIMEZONE=Asia/Shanghai
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-me-to-a-random-string}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=false
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - EXECUTIONS_DATA_PRUNE_ENABLED=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50000
      - N8N_PAYLOAD_SIZE_MAX=64
      # API Keys - from .env file
      - AGNES_API_KEY=${AGNES_API_KEY}
      - MIMO_API_KEY=${MIMO_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://apihub.agnes-ai.com/v1}
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./n8n-files:/files
    networks:
      - n8n-network

  composer:
    build:
      context: .
      dockerfile: Dockerfile.composer
    container_name: n8n-composer
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      - MIMO_API_KEY=${MIMO_API_KEY}
      - COMPOSER_PORT=8899
      - COMPOSER_OUTPUT_DIR=/files
    volumes:
      - ./n8n-files:/files
    networks:
      - n8n-network

networks:
  n8n-network:
    driver: bridge
